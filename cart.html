<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="./assets/css/styles.css">
    <script type="module" src="./assets/js/cart.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner page-width">
        <a class="brand" href="./index.html" aria-label="iSAX Market home">
          <img src="./assets/images/brand-mark.svg" width="34" height="34" alt="">
          <span>iSAX <span class="brand-light">Market</span></span>
        </a>
        <nav class="main-nav" id="primary-navigation" aria-label="Main navigation">
          <a class="nav-link" href="./index.html">Home</a>
          <a class="nav-link" href="./products.html">Shop</a>
          <a class="nav-link" href="./orders.html">Orders</a>
        </nav>
        <div class="header-actions">
          <button class="theme-toggle icon-button" type="button" aria-label="Switch to dark theme">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>

          </button>
          <a class="account-link" href="./orders.html">Account</a>
          <a class="bag-link" href="./cart.html" aria-label="View shopping bag">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
            <span>Bag <span class="bag-count">0</span></span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell page-width cart-page">
      <div class="page-header">
        <p class="eyebrow">BAG</p>
        <h1>Shopping bag</h1>
      </div>
      <div id="cart-content"></div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner page-width">
        <a class="brand footer-brand" href="./index.html"><img src="./assets/images/brand-mark.svg" width="30" height="30" alt=""><span>iSAX <span class="brand-light">Market</span></span></a>
        <p>Store contact details are placeholders until the business details are approved.</p>
        <span>© <span id="current-year"></span> iSAX Market</span>
      </div>
    </footer>

    <script type="module" src="./assets/js/theme.js"></script>
